name: Rebrand Auxio to BeeMusic

on:
  workflow_dispatch:

jobs:
  rebrand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y rename

      - name: Rename Strings
        run: |
          find . -type f \( \
            -name "*.kt" -o \
            -name "*.java" -o \
            -name "*.xml" -o \
            -name "*.gradle" -o \
            -name "*.md" -o \
            -name "*.properties" \
          \) -exec sed -i \
          -e 's/org\.oxycblt\.auxio/com.kur0iber.beemusic/g' \
          -e 's/Org\.Oxycblt\.Auxio/Com.Kur0iber.Beemusic/g' \
          -e 's/Auxio/BeeMusic/g' \
          -e 's/auxio/beemusic/g' \
          {} +

      - name: Rename Kotlin Package Folder
        run: |
          mkdir -p app/src/main/kotlin/com/kur0iber

          if [ -d "app/src/main/kotlin/org/oxycblt/auxio" ]; then
            mv app/src/main/kotlin/org/oxycblt/auxio \
               app/src/main/kotlin/com/kur0iber/beemusic
          fi

          rm -rf app/src/main/kotlin/org || true

      - name: Rename Java Package Folder
        run: |
          mkdir -p app/src/main/java/com/kur0iber

          if [ -d "app/src/main/java/org/oxycblt/auxio" ]; then
            mv app/src/main/java/org/oxycblt/auxio \
               app/src/main/java/com/kur0iber/beemusic
          fi

          rm -rf app/src/main/java/org || true

      - name: Update settings.gradle
        run: |
          sed -i 's/rootProject.name = "Auxio"/rootProject.name = "BeeMusic"/g' settings.gradle || true
          sed -i 's/rootProject.name = '\''Auxio'\''/rootProject.name = '\''BeeMusic'\''/g' settings.gradle || true

      - name: Generate BeeMusic Icons Placeholder
        run: |
          mkdir -p app/src/main/res/drawable
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M54,10A44,44 0,1 1,10 54A44,44 0,0 1,54 10z"/>
          </vector>' \
          > app/src/main/res/drawable/beemusic_placeholder.xml

      - name: Clean Gradle Cache
        run: |
          ./gradlew clean || true

      - name: Commit Changes
        run: |
          git add .
          git commit -m "Automatic rebrand Auxio -> BeeMusic" || echo "No changes"

      - name: Push Changes
        run: |
          git push
